vaadin.launch-browser=true
spring.application.name=torben-photography

# MySQL, Zugangsdaten kommen aus Umgebungsvariablen (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/photography_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:test_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Das Schema verwaltet Flyway (src/main/resources/db/migration), Hibernate ändert nichts
spring.jpa.hibernate.ddl-auto=none
# bestehende Datenbanken ohne Flyway-Historie werden übernommen, V1 legt nur fehlende Tabellen an
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# Admin-Zugang für die Verwaltung der Anfragen, ohne Passwort ist die Anmeldung deaktiviert
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Benachrichtigung bei neuen Anfragen. Der Mailserver wird über die Spring-Variablen
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME und SPRING_MAIL_PASSWORD gesetzt.
app.notification.recipient=${NOTIFICATION_RECIPIENT:}
app.notification.sender=${NOTIFICATION_SENDER:}
app.notification.confirm-customer=${NOTIFICATION_CONFIRM_CUSTOMER:false}

# Ordner mit den Bildern (Unterordner je Kategorie, siehe README)
app.images.dir=${IMAGES_DIR:./bilder}
