vaadin.launch-browser=true
spring.application.name=demo

# MySQL, Zugangsdaten kommen aus Umgebungsvariablen (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/photography_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:test_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
