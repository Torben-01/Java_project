privacy.2.text=When you send a request, we store the category, salutation, first and last name, email address, preferred date, your comment and the time of your consent.|The data is used exclusively to process your request (Art. 6 (1) (b) GDPR, pre-contractual measures) and is not passed on to third parties.|It is deleted once the request is completed, unless statutory retention obligations apply.
